<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #grand-parent{
            background-color: green;
            width : 300px;
            height : 300px;
        }
        #parent{
            background-color: blue;
            width : 200px;
            height : 200px;
        }
        #child{
            background-color: red;
            width : 100px;
            height : 100px;
        }
        #grand-child{
            background-color : purple;
            height : 50px;
            width : 50px;
        }

        div{
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="grand-parent">
        <div id="parent">
            <div id="child">
                <div id="grand-child">

                </div>
            </div>
        </div>
    </div>

    <script>
        let grandParent = document.getElementById("grand-parent");
        let parent = document.getElementById("parent");
        let child = document.getElementById("child");
        let grandChild = document.getElementById("grand-child");

        grandParent.addEventListener('click',()=>{
            console.log('Grand Parent is clicked');
        },true)

        parent.addEventListener('click',()=>{
            console.log('Parent is clicked');
        },true)

        child.addEventListener('click',()=>{
            console.log('Child is clicked');
        },true)

        grandChild.addEventListener('click',()=>{
            console.log('Grand Child is clicked');
        },true)
    </script>
</body>
</html>
